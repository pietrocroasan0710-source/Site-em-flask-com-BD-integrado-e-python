<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalhes do jogo — PixelShelf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5d8f'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%23171433'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="../CSS/style.css">
<script src="../JS/fx.js" defer></script>
<script src="../JS/dados.js" defer></script>
<script src="../JS/detalhe.js" defer></script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="glow g1" aria-hidden="true"></div>
<div class="glow g2" aria-hidden="true"></div>
<div class="glow g3" aria-hidden="true"></div>

<header>
  <button class="menu" id="menu" type="button" aria-expanded="false" aria-controls="nav" aria-label="Abrir menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  <a class="logo" href="./home.html">Pixel<span>Shelf</span></a>
  <nav id="nav">
    <a href="./home.html">Início</a>
    <a href="./jogos.html" aria-current="page">Jogos</a>
    <a href="./cadastrar-jogo.html">Cadastrar jogo</a>
    <a href="./favoritos.html">Favoritos</a>
    <button class="btn tema" id="tema" type="button" aria-label="Alternar entre tema claro e escuro">Tema</button>
    <a class="btn" href="./login.html">Entrar</a>
    <a class="btn primary" href="./registro.html">Criar conta</a>
  </nav>
</header>

<main class="pagina">
  <a class="voltar" href="./jogos.html">← Todos os jogos</a>
  <div class="caixa form-box largo" id="vazio" hidden>
    <h1>Jogo não encontrado</h1>
    <p class="sub">Esse jogo não está no catálogo.</p>
    <a class="btn primary" href="./jogos.html">Ver todos os jogos</a>
  </div>
  <article class="detalhe" id="detalhe" hidden>
    <div class="cover" id="capa"></div>
    <div>
      <h1 id="titulo"></h1>
      <div class="tags" id="tags"></div>
      <div class="nota-grande"><b id="media"></b><div><div class="stars" id="estrelas"></div><small id="total"></small></div></div>
      <p id="desc"></p>
      <button class="btn" id="fav" type="button" aria-pressed="false"></button>
    </div>
  </article>
  <section class="avaliacoes" id="avals" hidden>
    <form class="form-box largo" id="form" novalidate>
      <h2>Deixe sua avaliação</h2>
      <div class="aviso" id="aviso" role="alert" hidden></div>
      <label for="nome">Seu nome</label>
      <input id="nome" type="text" maxlength="40" placeholder="Como quer ser chamado">
      <small class="msg" id="e-nome"></small>
      <label id="rotulo-nota">Sua nota</label>
      <div class="estrelas-input" id="notas" role="radiogroup" aria-labelledby="rotulo-nota">
        <input type="radio" name="nota" id="n5" value="5"><label for="n5" title="5 estrelas">★</label>
        <input type="radio" name="nota" id="n4" value="4"><label for="n4" title="4 estrelas">★</label>
        <input type="radio" name="nota" id="n3" value="3"><label for="n3" title="3 estrelas">★</label>
        <input type="radio" name="nota" id="n2" value="2"><label for="n2" title="2 estrelas">★</label>
        <input type="radio" name="nota" id="n1" value="1"><label for="n1" title="1 estrela">★</label>
      </div>
      <small class="msg" id="e-nota"></small>
      <label for="texto">Comentário</label>
      <textarea id="texto" rows="4" maxlength="500" placeholder="O que você achou do jogo?"></textarea>
      <small class="msg" id="e-texto"></small>
      <button class="btn primary enviar" type="submit">Publicar avaliação</button>
    </form>
    <div>
      <h2>Avaliações</h2>
      <div id="lista"></div>
    </div>
  </section>
</main>

<footer>
  <div class="foot">
    <div><a class="logo" href="./home.html">Pixel<span>Shelf</span></a><p>Catálogo de jogos.</p></div>
    <div><h4>Site</h4><a href="./jogos.html">Jogos</a><a href="./favoritos.html">Favoritos</a><a href="./cadastrar-jogo.html">Cadastrar jogo</a></div>
    <div><h4>Conta</h4><a href="./login.html">Entrar</a><a href="./registro.html">Criar conta</a></div>
  </div>
</footer>
</body>
</html>
