<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastrar jogo — PixelShelf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5d8f'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%23171433'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="../CSS/style.css">
<script src="../JS/fx.js" defer></script>
<script src="../JS/dados.js" defer></script>
<script src="../JS/cadastrar.js" defer></script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="glow g1" aria-hidden="true"></div>
<div class="glow g2" aria-hidden="true"></div>
<div class="glow g3" aria-hidden="true"></div>

<header>
  <button class="menu" id="menu" type="button" aria-expanded="false" aria-controls="nav" aria-label="Abrir menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  <a class="logo" href="./home.html">Pixel<span>Shelf</span></a>
  <nav id="nav">
    <a href="./home.html">Início</a>
    <a href="./jogos.html">Jogos</a>
    <a href="./cadastrar-jogo.html" aria-current="page">Cadastrar jogo</a>
    <a href="./favoritos.html">Favoritos</a>
    <button class="btn tema" id="tema" type="button" aria-label="Alternar entre tema claro e escuro">Tema</button>
    <a class="btn" href="./login.html">Entrar</a>
    <a class="btn primary" href="./registro.html">Criar conta</a>
  </nav>
</header>

<main class="pagina">
  <div class="topo-pagina"><h1>Cadastrar jogo</h1><p>Adicione ao catálogo um jogo que ainda não está nele.</p></div>
  <div class="duas">
    <section class="form-box largo">
      <div class="aviso" id="aviso" role="alert" hidden></div>
      <form id="form" novalidate>
        <label for="titulo">Nome do jogo</label>
        <input id="titulo" type="text" maxlength="60" placeholder="Ex.: Hollow Orbit">
        <small class="msg" id="e-titulo"></small>

        <label for="genero">Gênero</label>
        <select id="genero"><option value="">Escolha um gênero</option><option>Aventura</option><option>Ação</option><option>Corrida</option><option>Esporte</option><option>Estratégia</option><option>Plataforma</option><option>Puzzle</option><option>RPG</option><option>Simulação</option><option>Terror</option></select>
        <small class="msg" id="e-genero"></small>

        <label id="rotulo-plats">Plataformas</label>
        <div class="opcoes" id="plats" role="group" aria-labelledby="rotulo-plats">
          <label class="lembrar"><input type="checkbox" value="PC"> PC</label><label class="lembrar"><input type="checkbox" value="PlayStation"> PlayStation</label><label class="lembrar"><input type="checkbox" value="Xbox"> Xbox</label><label class="lembrar"><input type="checkbox" value="Switch"> Switch</label><label class="lembrar"><input type="checkbox" value="Mobile"> Mobile</label>
        </div>
        <small class="msg" id="e-plats"></small>

        <label for="ano">Ano de lançamento</label>
        <input id="ano" type="number" min="1970" max="2100" placeholder="2024">
        <small class="msg" id="e-ano"></small>

        <label for="desc">Descrição</label>
        <textarea id="desc" rows="4" maxlength="300" placeholder="Sobre o que é o jogo?"></textarea>
        <small class="msg" id="e-desc"></small>

        <label>Cores da capa</label>
        <div class="cores"><input id="c1" type="color" value="#ff5d8f" aria-label="Cor inicial da capa"><input id="c2" type="color" value="#6a3de8" aria-label="Cor final da capa"></div>

        <button class="btn primary enviar" type="submit">Cadastrar jogo</button>
      </form>
    </section>
    <div class="previa">
      <p class="meta">Prévia do cartão</p>
      <article class="card" style="--i:0">
        <div class="cover" id="pcapa">Nome do jogo</div>
        <div class="info"><div class="stars">☆☆☆☆☆</div><div class="meta" id="pmeta">Gênero · Plataformas</div></div>
      </article>
    </div>
  </div>
</main>

<footer>
  <div class="foot">
    <div><a class="logo" href="./home.html">Pixel<span>Shelf</span></a><p>Catálogo de jogos.</p></div>
    <div><h4>Site</h4><a href="./jogos.html">Jogos</a><a href="./favoritos.html">Favoritos</a><a href="./cadastrar-jogo.html">Cadastrar jogo</a></div>
    <div><h4>Conta</h4><a href="./login.html">Entrar</a><a href="./registro.html">Criar conta</a></div>
  </div>
</footer>
</body>
</html>
