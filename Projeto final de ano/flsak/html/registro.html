<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta — PixelShelf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5d8f'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%23171433'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="../CSS/style.css">
<link rel="stylesheet" href="../CSS/login.css">
<link rel="stylesheet" href="../CSS/registro.css">
<script src="../JAVA/fx.js" defer></script>
<script src="../JAVA/registro.js" defer></script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="glow g1" aria-hidden="true"></div>
<div class="glow g2" aria-hidden="true"></div>
<div class="glow g3" aria-hidden="true"></div>

<header>
  <a class="logo" href="./home.html">Pixel<span>Shelf</span></a>
  <button class="btn tema" id="tema" type="button" aria-label="Alternar entre tema claro e escuro"></button>
</header>

<main class="auth">
  <section class="cena" aria-hidden="true">
    <div class="bh"><div class="halo"></div><div class="core"></div><div class="disk"></div></div>
    <h2>Entre na órbita do PixelShelf.</h2>
    <p>Crie sua conta para avaliar, comentar e guardar seus jogos favoritos.</p>
  </section>

  <section class="form-box">
    <h1>Criar conta</h1>
    <p class="sub">Leva menos de um minuto.</p>
    <!-- Flask: mostrar aqui as mensagens do flash(), ex.: "Este e-mail já está cadastrado" -->
    <div class="aviso" id="aviso" role="alert" hidden></div>
    <form id="form" method="post" action="/registro" novalidate>
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Como quer ser chamado">
      <small class="msg" id="e-nome"></small>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="nome@email.com">
      <small class="msg" id="e-email"></small>

      <label for="senha">Senha</label>
      <div class="senha">
        <input id="senha" name="senha" type="password" autocomplete="new-password" placeholder="Crie uma senha">
        <button type="button" class="ver" data-alvo="senha" aria-label="Mostrar senha">Mostrar</button>
      </div>
      <div class="forca" id="forca" data-n="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <small class="dica" id="dica">Use 8 ou mais caracteres, com letras, números e símbolos.</small>
      <small class="msg" id="e-senha"></small>

      <label for="conf">Confirmar senha</label>
      <div class="senha">
        <input id="conf" name="confirmar" type="password" autocomplete="new-password" placeholder="Repita a senha">
        <button type="button" class="ver" data-alvo="conf" aria-label="Mostrar confirmação de senha">Mostrar</button>
      </div>
      <small class="msg" id="e-conf"></small>

      <label class="lembrar"><input id="termos" type="checkbox" name="termos"> Li e aceito os termos de uso</label>
      <small class="msg" id="e-termos"></small>

      <button class="btn primary enviar" type="submit">Criar conta</button>
    </form>
    <p class="troca">Já tem conta? <a href="./login.html">Entrar</a></p>
  </section>
</main>
</body>
</html>
